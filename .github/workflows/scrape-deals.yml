name: Automated FSA Deal Discovery & Sync

on:
  schedule:
    # Run every 12 hours at minute 0 (00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual execution run'
        required: false
        default: 'Manual on-demand discovery'

jobs:
  scrape-and-sync:
    name: Scrape CVS & Costco FSA Deals
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Deal Collector Pipeline
        env:
          APP_URL: ${{ vars.APP_URL || 'https://fsatracker.netlify.app' }}
          SYNC_SECRET_TOKEN: ${{ secrets.SYNC_SECRET_TOKEN }}
        run: npm run sync:playwright

      - name: Upload Diagnostic Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-diagnostics
          path: sync-diagnostics.log
          if-no-files-found: ignore
          retention-days: 7
